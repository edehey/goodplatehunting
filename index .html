<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Good Plate Hunting</title>
<meta name="theme-color" content="#1f4fd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PlateHunt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#fff8e7;--card:#fff;--ink:#2b2a33;--mut:#7a7686;--acc:#f2b705;--acc2:#1f4fd8;--line:#e7dfc8;--ok:#1d9a5b;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161d;--card:#23222c;--ink:#f4f1e8;--mut:#9b97a8;--line:#363444;--acc2:#7aa2ff}}
:root[data-theme="dark"]{--bg:#17161d;--card:#23222c;--ink:#f4f1e8;--mut:#9b97a8;--line:#363444;--acc2:#7aa2ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;background-image:radial-gradient(rgba(31,79,216,.07) 1.5px,transparent 1.5px);background-size:22px 22px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 2px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:0;border-radius:22px;box-shadow:0 8px 24px rgba(18,48,143,.09);padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em;color:var(--acc2)}
.plate{display:inline-block;background:#fff;color:#111;border:3px solid #111;border-radius:8px;padding:2px 10px;font:700 20px/1.3 ui-monospace,monospace;letter-spacing:.08em;position:relative;padding-left:26px}
.plate:before{content:"E";position:absolute;left:0;top:0;bottom:0;width:18px;background:#1f4fd8;color:#fc0;font-size:11px;display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;flex:1}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 14px;background:var(--acc2);color:#fff;cursor:pointer}
button.big{width:100%;background:#ffd21f;color:#111;border:3px solid #111;box-shadow:0 5px 0 #111;border-radius:16px;font-weight:800;font-size:18px;padding:14px;margin-top:10px;transition:transform .08s,box-shadow .08s}
button.big:active{transform:translateY(4px);box-shadow:0 1px 0 #111}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:500}
button.ok{background:var(--ok)}
button.x{background:transparent;color:var(--mut);padding:2px 8px;font-size:15px;border:1px solid var(--line);margin-left:6px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 12px;display:inline-flex;gap:6px;align-items:center}
.chip b{cursor:pointer;color:var(--mut)}
.debt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.debt:first-of-type{border-top:0}
.log{font-size:14px;color:var(--mut);padding:8px 0;border-top:1px solid var(--line)}
.log:first-of-type{border-top:0}
.pc{display:block;font-size:12px;margin-top:2px}
.score{display:flex;gap:8px;flex-wrap:wrap}
.score div{flex:1;min-width:90px;text-align:center;background:var(--bg);border-radius:16px;padding:8px}
.score .n{font-size:26px;font-weight:800;color:var(--acc2)}
.empty{color:var(--mut);font-size:14px}
.th{max-width:140px;border-radius:8px;margin-top:4px;display:block}
canvas.cv{width:100%;touch-action:none;border-radius:10px;border:1px solid var(--line);cursor:crosshair}
.up{cursor:pointer;padding:10px 14px;border-radius:999px;border:1px solid var(--line);color:var(--mut);display:inline-block}
.hero{position:relative;background:linear-gradient(160deg,#1f4fd8,#12308f);margin:-16px -16px 20px;padding:44px 20px 24px;text-align:center;border-radius:0 0 32px 32px;box-shadow:0 10px 30px rgba(18,48,143,.25)}
.hero svg{width:min(300px,80%);height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.3));transform:rotate(-3deg)}
.hero h1{color:#fff;font-size:26px;font-weight:900;letter-spacing:.08em;margin:14px 0 4px}
.hero h1 span{color:#ffd21f}
.hero .sub{color:rgba(255,255,255,.88);margin:0}
select.lang{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;flex:none;width:auto;padding:4px 10px;font-size:13px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:999px}
select.lang option{color:#111}
button.share{margin-top:14px;background:#ffd21f;color:#111;border:2px solid #111;font-weight:800;box-shadow:0 3px 0 #111}
input:focus,select:focus,textarea:focus{outline:3px solid #ffd21f;border-color:#111}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:12px 0}.gal figure{margin:0}.gal img{width:100%;border-radius:12px;display:block}.gal figcaption{font-size:13px;color:var(--mut);margin:4px 0}
textarea{width:100%;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#111;color:#ffd21f;font-weight:800;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
summary.h2s{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--acc2);cursor:pointer;list-style:none;padding:2px 0}
summary.h2s::-webkit-details-marker{display:none}
details#howd{margin-bottom:10px}
details#howd p{font-size:14px;margin:8px 0 0;padding:10px;border-radius:12px;background:var(--bg)}
.hero svg{animation:wig 3.2s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(1deg) translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{transform:scale(.4);opacity:.5}}
@media (prefers-reduced-motion:reduce){.hero svg,.tw{animation:none}}
.ava{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--line);display:block;margin:0 auto 4px}
.ava.big{width:96px;height:96px;margin:0 auto 8px}
.score div[data-pf]{cursor:pointer}
dialog{border:0;border-radius:22px;padding:18px;max-width:min(92vw,420px);width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.ini{display:inline-block;font-size:11px;font-weight:800;background:#ffd21f;color:#111;border-radius:99px;padding:1px 8px;margin-left:4px}
.show{position:relative;border-radius:16px;overflow:hidden;background:#111;min-height:200px;display:flex;align-items:center;justify-content:center}
.show img,.show video{width:100%;max-height:360px;object-fit:contain;display:block}
.show .cp{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;color:#fff;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.show button.nv{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);padding:8px 14px;font-size:18px}
.show button.l{left:8px}.show button.r{right:8px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--acc2)}
.gal video{width:100%;border-radius:12px;display:block}
</style></head><body><main>
<div class="hero">
<select id="lang" class="lang" aria-label="Language"><option value="en">English</option><option value="es">Español</option><option value="ca">Català</option><option value="nl">Nederlands</option></select>
<svg viewBox="36 160 440 240" role="img" aria-label="Good Plate Hunting"><defs><clipPath id="c2"><rect x="56" y="170" width="400" height="150" rx="24"/></clipPath></defs><g><circle cx="128" cy="322" r="30" fill="#111"/><circle cx="128" cy="322" r="12" fill="#ffd21f"/><circle cx="384" cy="322" r="30" fill="#111"/><circle cx="384" cy="322" r="12" fill="#ffd21f"/></g><rect x="56" y="170" width="400" height="150" rx="24" fill="#fff"/><g clip-path="url(#c2)"><rect x="56" y="170" width="58" height="150" fill="#1f4fd8"/></g><g fill="#ffd21f"><circle cx="85" cy="212" r="5"/><circle cx="85" cy="278" r="5"/><circle cx="68" cy="245" r="5"/><circle cx="102" cy="245" r="5"/><circle cx="74" cy="223" r="5"/><circle cx="96" cy="223" r="5"/><circle cx="74" cy="267" r="5"/><circle cx="96" cy="267" r="5"/></g><rect x="56" y="170" width="400" height="150" rx="24" fill="none" stroke="#111" stroke-width="10"/><text x="128" y="270" font-family="ui-monospace,Menlo,Consolas,monospace" font-weight="800" font-size="80" fill="#111" letter-spacing="2">4830</text><g fill="#9a9a9a"><rect x="352" y="208" width="26" height="26"/><rect x="378" y="234" width="26" height="26" fill="#c4c4c4"/><rect x="404" y="208" width="26" height="26" fill="#bbb"/><rect x="352" y="260" width="26" height="26" fill="#bbb"/><rect x="404" y="260" width="26" height="26"/></g><circle cx="330" cy="248" r="96" fill="#ffd21f" fill-opacity=".18" stroke="#ffd21f" stroke-width="24"/><line x1="398" y1="316" x2="454" y2="378" stroke="#ffd21f" stroke-width="34" stroke-linecap="round"/><g fill="#ffd21f"><path class="tw" d="M64 170Q64 184 78 184Q64 184 64 198Q64 184 50 184Q64 184 64 170Z"/><path class="tw" style="animation-delay:.5s" d="M462 186Q462 196 472 196Q462 196 462 206Q462 196 452 196Q462 196 462 186Z"/><path class="tw" style="animation-delay:1s" d="M46 363Q46 372 55 372Q46 372 46 381Q46 372 37 372Q46 372 46 363Z"/></g></svg>
<h1>GOOD PLATE <span>HUNTING</span></h1>
<p class="sub" data-i="tag"></p>
<button class="share" id="share" data-i="share"></button>
</div>

<div class="card"><h2 data-i="h1"></h2><p class="empty" data-i="initInfo" style="margin:0 0 10px"></p>
<div id="players" class="row" style="margin-bottom:10px"></div>
<div class="row"><input id="pn" data-ph="phName"><button id="addP" data-i="add"></button></div></div>

<div class="card"><details id="howd"><summary class="h2s"><span data-i="h2"></span> ⓘ</summary><p data-i="how"></p></details>
<div id="nums" class="row" style="margin-bottom:10px"></div>
<div class="row"><input id="nn" data-ph="phNum" maxlength="8" inputmode="numeric"><button id="addN" data-i="setN"></button></div></div>

<div class="card"><h2 data-i="h3"></h2>
<div class="row"><select id="sp"></select></div>
<div class="row" style="margin-top:8px"><input id="pl" data-ph="phPlate" maxlength="10" autocapitalize="characters" autocomplete="off"></div>
<div class="row" style="margin-top:8px">
<label class="up"><span data-i="take"></span><input id="ph2" type="file" accept="image/*" capture="environment" hidden></label>
<label class="up"><span data-i="pick"></span><input id="ph" type="file" accept="image/*" hidden></label>
<button class="ghost" id="undo" hidden data-i="undo"></button></div>
<div id="pcs" class="pc" style="margin-top:6px" hidden></div>
<div id="abs" class="pc" style="margin-top:4px" hidden></div>
<div id="cw" hidden><p class="empty" data-i="blur"></p><canvas id="cv" class="cv"></canvas></div>
<button class="big" id="spot" data-i="spot"></button></div>

<div class="card"><h2 data-i="hs"></h2><div id="score" class="score"></div></div>
<div class="card"><h2 data-i="ho"></h2><div id="debts"></div></div>
<div class="card"><h2 data-i="hl"></h2><div id="log"></div></div>
<div class="card" id="story"><h2 data-i="hst"></h2>
<p id="stT" style="white-space:pre-wrap;margin:0"></p>
<div id="stG" class="gal"></div>
<div id="stVd" class="gal"></div>
<div id="stE" hidden><textarea id="stX" rows="10"></textarea><label class="up"><span data-i="addProof"></span><input id="stP" type="file" accept="image/*" hidden></label> <label class="up"><span data-i="addVideo"></span><input id="stV" type="file" accept="video/*" hidden></label><p class="empty" data-i="storyNote" style="margin:8px 0 0"></p></div>
<button class="ghost" id="stB" style="margin-top:10px"></button></div>
<div class="card" id="slideCard" hidden><h2 data-i="hshow"></h2><div class="show" id="show"></div><div class="dots" id="dots"></div></div>

<div class="row" style="justify-content:center;margin-bottom:10px">
<button class="ghost" id="exp" data-i="exp"></button>
<label class="up"><span data-i="imp"></span><input id="impf" type="file" accept="application/json,.json" hidden></label>
<button class="ghost" id="inst" hidden data-i="install"></button>
<button class="ghost" id="reset" data-i="reset"></button></div>

<div class="card" style="margin-top:14px;text-align:center"><p style="margin:0 0 10px" data-i="priv"></p>
<a id="rmBtn" class="up" style="text-decoration:none;color:var(--acc2);border-color:var(--acc2);font-weight:600" href="#" data-i="rmBtn"></a></div>
</main>
<dialog id="pd"><div style="text-align:center"><label style="cursor:pointer;display:block"><img id="pdA" class="ava big" alt=""><span class="up" style="font-size:13px;padding:4px 12px" data-i="pfPhoto"></span><input id="pdF" type="file" accept="image/*" hidden></label><h2 id="pdN" style="margin:10px 0 2px"></h2><div id="pdI"></div></div><textarea id="pdB" rows="3" maxlength="140" data-ph="pfBio" style="margin-top:10px"></textarea><div id="pdS" style="font-size:14px;margin-bottom:12px"></div><div class="row"><button id="pdSave" data-i="pfSave"></button><button class="ghost" id="pdX" data-i="pfClose"></button></div></dialog>
<div id="toast" role="status"></div>

function readExif(buf){const v=new DataView(buf);if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return null;let o=2;

function loadTess(){return tessP||(tessP=new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=ok;s.onerror=()=>{tessP=null;no(new Error("load"))};document.head.appendChild(s)}))}
function abStatus(k,c){const el=$("abs");el.hidden=!k;el.textContent=k?t(k):"";el.style.color=c||"var(--mut)"}
function blurRect(rx,ry,rw,rh){stack.push(cx.getImageData(0,0,cv.width,cv.height));const t2=document.createElement("canvas");t2.width=Math.max(2,Math.round(rw/12));t2.height=Math.max(2,Math.round(rh/12));t2.getContext("2d").drawImage(cv,rx,ry,rw,rh,0,0,t2.width,t2.height);cx.imageSmoothingEnabled=false;cx.drawImage(t2,0,0,t2.width,t2.height,rx,ry,rw,rh);cx.imageSmoothingEnabled=true}
async function autoBlur(){const my=++abSeq;abStatus("abWait");
 try{await loadTess();
  if(!tessW){tessW=await Tesseract.createWorker("eng");await tessW.setParameters({tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",tessedit_pageseg_mode:"11"})}
  const{data}=await tessW.recognize(big);
  if(my!==abSeq)return;
  const k=cv.width/big.width;let n=0;
  const reg=(x0,y0,x1,y1)=>{const w=x1-x0,h=y1-y0,px=w*.12+4,py=h*.25+3,rx=Math.max(0,(x0-px)*k),ry=Math.max(0,(y0-py)*k),rx2=Math.min(cv.width,(x1+px)*k),ry2=Math.min(cv.height,(y1+py)*k);if(rx2-rx>6&&ry2-ry>6){blurRect(rx,ry,rx2-rx,ry2-ry);n++}};
  for(const w of(data.words||[])){const txt=(w.text||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(!txt||w.confidence<25||!w.bbox)continue;
   const L=/^\d{3,4}[A-Z]{3}$/.test(txt),F=/^[BCDFGHJKLMNPRSTVWXYZ]{3}$/.test(txt);if(!L&&!F)continue;
   const b=w.bbox;
   if(F){reg(b.x0,b.y0,b.x1,b.y1);continue}
   const syms=(w.symbols||[]).filter(s=>/[A-Z]/i.test(s.text)&&s.bbox);
   if(syms.length>=3){const l=syms.slice(-3);reg(Math.min(...l.map(s=>s.bbox.x0)),Math.min(...l.map(s=>s.bbox.y0)),Math.max(...l.map(s=>s.bbox.x1)),Math.max(...l.map(s=>s.bbox.y1)))}
   else{const sx=b.x0+(b.x1-b.x0)*(txt.length-3)/txt.length;reg(sx,b.y0,b.x1,b.y1)}}
  if(my!==abSeq)return;
  n?abStatus("abOk","var(--ok)"):abStatus("abNone","var(--bad)")
 }catch(e){if(my===abSeq)abStatus("abFail","var(--bad)")}}
$("ph").onchange=onPhoto;$("ph2").onchange=onPhoto;
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cv.onpointerdown=e=>{if(!cvImg)return;cv.setPointerCapture(e.pointerId);drag={p:pt(e),snap:cx.getImageData(0,0,cv.width,cv.height)}};
cv.onpointermove=e=>{if(!drag)return;const[a,b]=drag.p,[x,y]=pt(e);cx.putImageData(drag.snap,0,0);cx.strokeStyle="#f2b705";cx.lineWidth=2;cx.strokeRect(a,b,x-a,y-b)};
cv.onpointerup=e=>{if(!drag)return;const[a,b]=drag.p,[x,y]=pt(e),sn=drag.snap;drag=null;cx.putImageData(sn,0,0);
 const rx=Math.max(0,Math.min(a,x)),ry=Math.max(0,Math.min(b,y)),rw=Math.min(cv.width-rx,Math.abs(x-a)),rh=Math.min(cv.height-ry,Math.abs(y-b));
 if(rw<8||rh<8)return;stack.push(sn);
 const t2=document.createElement("canvas");t2.width=Math.max(2,Math.round(rw/12));t2.height=Math.max(2,Math.round(rh/12));
 t2.getContext("2d").drawImage(cv,rx,ry,rw,rh,0,0,t2.width,t2.height);
 cx.imageSmoothingEnabled=false;cx.drawImage(t2,0,0,t2.width,t2.height,rx,ry,rw,rh);cx.imageSmoothingEnabled=true};
$("undo").onclick=()=>{if(stack.length)cx.putImageData(stack.pop(),0,0)};
async function hashPlate(p){const s="platelunch|"+p.replace(/[^A-Z0-9]/g,"");
 try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
 catch(e){let h=5381;for(const c of s)h=(h*33)^c.charCodeAt(0);return"x"+(h>>>0)}}
const ham=(a,b)=>[...a].filter((c,i)=>c!==b[i]).length;
$("spot").onclick=async()=>{const who=$("sp").value,num=S.nums[0];
 if(S.players.length<2||!num){alert(t("setup"));return}
 const norm=$("pl").value.toUpperCase().replace(/[\s.\-]/g,"");
 if(!norm){alert(t("needPlate"));return}
 if(!PLATE.test(norm)){alert(t("badFmt"));return}
 if(!norm.includes(num.replace(/[\s.\-]/g,""))){alert(t("wrongNum",num));return}
 const h=await hashPlate(norm);
 const first=S.events.find(e=>e.h===h);if(first){alert(t("dbl",first.who));return}
 if(cvImg){
  if(pc&&pc.s==="old"){alert(t("old"));return}
  if(pc&&pc.s==="ed"){alert(t("edited",pc.sw));return}
  if(pc&&pc.s==="no"&&!confirm(t("noMeta")))return;
  const pd=ah&&S.events.find(e=>e.ah&&ham(e.ah,ah)<=4);if(pd&&!confirm(t("photoDup",pd.who)))return;
  if(!stack.length&&!confirm(t("noBlur")))return}
 const img=cvImg?cv.toDataURL("image/jpeg",0.6):null;
 S.events.push({t:"spot",who,num,plate:norm.slice(0,4)+"•••",h,ah:cvImg?ah:null,img,pc:cvImg&&pc?{s:pc.s,d:pc.d||null,sw:pc.sw||null}:null,ts:Date.now()});
 $("pl").value="";$("cw").hidden=true;$("undo").hidden=true;cvImg=null;ah=null;pc=null;abSeq++;abStatus(null);big=null;showPc();save();
 confetti();toast(t("toast",who))};
$("debts").onclick=e=>{const i=e.target.dataset.d;if(i!==undefined){const x=window._D[i];S.events.push({t:"paid",from:x.from,to:x.to,ts:Date.now()});save()}};

/* ---- story ---- */
let editing=false,ST={text:"It started with me, Eddy, and my kids Diego and Eliza in our old Mazda. We spotted a plate, 4830 FDY, picked 4830 as our number and made a deal: whoever spots 4830 first gets a free lunch from the others.\n\nWe turned it into a game, and since then we have found 4830 in many countries. Friends and neighbours heard about it, started hunting too, and now Good Plate Hunting is spreading around Barcelona, one lunch at a time.\n\nAbout us: Eddy, Diego and Eliza, plate hunters. Every plate is a chance for lunch.",photos:[]};
try{const r=localStorage.getItem("platelunch.story");if(r)ST=JSON.parse(r)}catch(e){}
function saveST(){try{localStorage.setItem("platelunch.story",JSON.stringify(ST))}catch(e){alert(t("full"))}renderST()}
function renderST(){$("stT").textContent=ST.text;
 $("stG").innerHTML=ST.photos.filter(p=>okImg(p.img)).map((p,i)=>`<figure><img src="${p.img}" alt=""><figcaption>${esc(p.cap||"")}</figcaption>${editing?`<button class="ghost" data-r="${i}">${t("rm")}</button>`:""}</figure>`).join("");
 $("stT").hidden=editing;$("stE").hidden=!editing;$("stB").textContent=editing?t("saveSt"):t("editSt");renderMedia()}
$("stB").onclick=()=>{if(editing){ST.text=$("stX").value;editing=false;saveST()}else{editing=true;$("stX").value=ST.text;renderST()}};
$("stG").onclick=e=>{const i=e.target.dataset.r;if(i!==undefined){ST.photos=ST.photos.filter(p=>okImg(p.img));ST.photos.splice(i,1);saveST()}};
$("stP").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,600/im.width),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);const cap=prompt(t("cap"),"")||"";ST.photos.push({img:c.toDataURL("image/jpeg",.65),cap});saveST()};im.src=URL.createObjectURL(f);e.target.value=""};

/* ---- videos (max 9 s, kept on this device) and slideshow ---- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open("platelunch-media",1);r.onupgradeneeded=()=>r.result.createObjectStore("v",{keyPath:"id",autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function vAll(){try{const d=await idb();return await new Promise((ok,no)=>{const q=d.transaction("v").objectStore("v").getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}catch(e){return[]}}
async function vPut(o){const d=await idb();return new Promise((ok,no)=>{const q=d.transaction("v","readwrite").objectStore("v").add(o);q.onsuccess=()=>ok();q.onerror=()=>no(q.error)})}
async function vDel(id){const d=await idb();return new Promise((ok,no)=>{const q=d.transaction("v","readwrite").objectStore("v").delete(id);q.onsuccess=()=>ok();q.onerror=()=>no(q.error)})}
let SHOW=[],shi=0,shT=null,vUrls=[];
const still=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function drawShow(){clearTimeout(shT);const c=$("slideCard");c.hidden=!SHOW.length;if(!SHOW.length)return;shi=(shi+SHOW.length)%SHOW.length;const s=SHOW[shi],many=SHOW.length>1;
 $("show").innerHTML=(s.k==="v"?`<video src="${s.src}" autoplay muted playsinline ${many?"":"loop"}></video>`:`<img src="${s.src}" alt="">`)+`<div class="cp">${esc(s.cap||"")}</div>`+(many?`<button class="nv l" data-s="-1" aria-label="previous">‹</button><button class="nv r" data-s="1" aria-label="next">›</button>`:"");
 $("dots").innerHTML=many?SHOW.map((_,i)=>`<i class="${i===shi?"on":""}"></i>`).join(""):"";
 if(!many||still())return;
 const go=()=>{shi++;drawShow()};
 if(s.k==="v"){$("show").querySelector("video").onended=go;shT=setTimeout(go,11000)}else shT=setTimeout(go,4000)}
$("show").onclick=e=>{const b=e.target.closest("[data-s]");if(b){shi+=+b.dataset.s;drawShow()}};
async function renderMedia(){vUrls.forEach(u=>URL.revokeObjectURL(u));vUrls=[];const vs=await vAll();
 $("stVd").innerHTML=vs.map(v=>{v._u=URL.createObjectURL(v.blob);vUrls.push(v._u);return`<figure><video src="${v._u}" controls playsinline preload="metadata"></video><figcaption>${esc(v.cap||"")}</figcaption>${editing?`<button class="ghost" data-vr="${v.id}">${t("rm")}</button>`:""}</figure>`}).join("");
 SHOW=[...ST.photos.filter(p=>okImg(p.img)).map(p=>({k:"i",src:p.img,cap:p.cap})),...vs.map(v=>({k:"v",src:v._u,cap:v.cap})),...S.events.filter(e=>e.t==="spot"&&okImg(e.img)).map(e=>({k:"i",src:e.img,cap:(e.plate||e.num)+" · "+e.who}))];
 shi=0;drawShow()}
$("stVd").onclick=async e=>{const b=e.target.closest("[data-vr]");if(b){try{await vDel(+b.dataset.vr)}catch(_){}renderMedia()}};
$("stV").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 const url=URL.createObjectURL(f),v=document.createElement("video");v.preload="metadata";
 const dur=await new Promise(ok=>{v.onloadedmetadata=()=>ok(v.duration);v.onerror=()=>ok(NaN);v.src=url});URL.revokeObjectURL(url);
 if(!(dur>0)){alert(t("vBad"));return}
 if(dur>9.5){alert(t("vLong"));return}
 const cap=prompt(t("cap"),"")||"";
 try{await vPut({blob:f,type:f.type,cap,ts:Date.now()})}catch(_){alert(t("full"));return}
 renderMedia()};

/* ---- player profiles ---- */
const ava=n=>{const p=S.prof[n];return p&&okImg(p.img)?p.img:"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#1f4fd8"/><text x="32" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#ffd21f">${esc((n||"?").slice(0,1).toUpperCase())}</text></svg>`)};
let pfName=null,pfImg=null;
function openProf(i){const n=S.players[i];if(n==null)return;pfName=n;const p=S.prof[n]||{};pfImg=okImg(p.img)?p.img:null;
 $("pdN").textContent=n;$("pdI").innerHTML=i===0?`<span class="ini">${t("ini")}</span>`:"";$("pdA").src=pfImg||ava(n);$("pdB").value=p.bio||"";
 const sp=S.events.filter(e=>e.t==="spot"&&e.who===n);
 $("pdS").innerHTML=`<b>${t("pfCars",sp.length)}</b>`+(sp.length?"<br>"+sp.slice(-20).reverse().map(e=>`<span class="plate" style="font-size:12px;padding-left:22px;margin:2px 4px 2px 0">${esc(e.plate||e.num)}</span>`).join(""):"");
 $("pd").showModal()}
$("score").onclick=e=>{const d=e.target.closest("[data-pf]");if(d)openProf(+d.dataset.pf)};
$("pdF").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=160;const s=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);URL.revokeObjectURL(im.src);pfImg=c.toDataURL("image/jpeg",.7);$("pdA").src=pfImg};im.src=URL.createObjectURL(f)};
$("pdSave").onclick=()=>{S.prof[pfName]={img:pfImg,bio:$("pdB").value.slice(0,140)};$("pd").close();save()};
$("pdX").onclick=()=>$("pd").close();

/* ---- share, backup, install, reset, language ---- */
$("share").onclick=async()=>{const d={title:"Good Plate Hunting",text:t("shareTxt"),url:location.href.split("#")[0]};
 try{if(navigator.share){await navigator.share(d);return}}catch(e){if(e&&e.name==="AbortError")return}
 try{await navigator.clipboard.writeText(d.text+" "+d.url);toast(t("copied"))}catch(e){prompt(d.text,d.url)}};
$("exp").onclick=()=>{const b=new Blob([JSON.stringify({app:"goodplatehunting",v:1,S,ST})],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="goodplatehunting-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};
$("impf").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 try{const j=JSON.parse(await f.text());
  if(j.app!=="goodplatehunting"||!j.S||!Array.isArray(j.S.players)||!Array.isArray(j.S.events)||!Array.isArray(j.S.nums))throw 0;
  if(!confirm(t("impQ")))return;
  S={players:j.S.players.map(String),nums:j.S.nums.map(String),events:j.S.events.filter(x=>x&&typeof x==="object").map(x=>({...x,img:okImg(x.img)?x.img:null})),prof:Object.fromEntries(Object.entries(j.S.prof&&typeof j.S.prof==="object"?j.S.prof:{}).map(([k,v])=>[String(k),{img:okImg(v&&v.img)?v.img:null,bio:String((v&&v.bio)||"").slice(0,140)}]))};
  if(j.ST&&typeof j.ST.text==="string"&&Array.isArray(j.ST.photos))ST={text:j.ST.text,photos:j.ST.photos.filter(p=>p&&okImg(p.img)).map(p=>({img:p.img,cap:String(p.cap||"")}))};
  try{localStorage.setItem("platelunch.story",JSON.stringify(ST))}catch(_){}
  save();renderST();toast(t("impOk"))}catch(_){alert(t("impBad"))}};
let dip=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e;$("inst").hidden=false});
$("inst").onclick=async()=>{if(!dip)return;dip.prompt();dip=null;$("inst").hidden=true};
$("reset").onclick=()=>{if(confirm(t("resetQ"))){S={players:[],nums:[],events:[],prof:{}};save()}};
function applyLang(){document.documentElement.lang=LG;$("lang").value=LG;
 document.querySelectorAll("[data-i]").forEach(el=>el.innerHTML=t(el.dataset.i));
 document.querySelectorAll("[data-ph]").forEach(el=>el.placeholder=t(el.dataset.ph));
 $("rmBtn").href="mailto:hello@goodplatehunting.com?subject="+encodeURIComponent(t("rmSub"))+"&body="+encodeURIComponent(t("rmBody"));
 showPc();render();renderST()}
$("lang").onchange=e=>{LG=e.target.value;try{localStorage.setItem("platelunch.lang",LG)}catch(_){}applyLang()};
applyLang();
