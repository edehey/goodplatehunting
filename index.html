<style>
:root{--bg:#fff8e7;--card:#fff;--ink:#2b2a33;--mut:#7a7686;--acc:#f2b705;--acc2:#1f4fd8;--line:#e7dfc8;--ok:#1d9a5b;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161d;--card:#23222c;--ink:#f4f1e8;--mut:#9b97a8;--line:#363444;--acc2:#7aa2ff}}
:root[data-theme="dark"]{--bg:#17161d;--card:#23222c;--ink:#f4f1e8;--mut:#9b97a8;--line:#363444;--acc2:#7aa2ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;background-image:radial-gradient(rgba(31,79,216,.07) 1.5px,transparent 1.5px);background-size:22px 22px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 2px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:0;border-radius:22px;box-shadow:0 8px 24px rgba(18,48,143,.09);padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em;color:var(--acc2)}
.plate{display:inline-block;background:#fff;color:#111;border:3px solid #111;border-radius:8px;padding:2px 10px;font:700 20px/1.3 ui-monospace,monospace;letter-spacing:.08em;position:relative;padding-left:26px}
.plate:before{content:"E";position:absolute;left:0;top:0;bottom:0;width:18px;background:#1f4fd8;color:#fc0;font-size:11px;display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;flex:1}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 14px;background:var(--acc2);color:#fff;cursor:pointer}
button.big{width:100%;background:#ffd21f;color:#111;border:3px solid #111;box-shadow:0 5px 0 #111;border-radius:16px;font-weight:800;font-size:18px;padding:14px;margin-top:10px;transition:transform .08s,box-shadow .08s}
button.big:active{transform:translateY(4px);box-shadow:0 1px 0 #111}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:500}
button.ok{background:var(--ok)}
button.x{background:transparent;color:var(--mut);padding:2px 8px;font-size:15px;border:1px solid var(--line);margin-left:6px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 12px;display:inline-flex;gap:6px;align-items:center}
.chip b{cursor:pointer;color:var(--mut)}
.debt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.debt:first-of-type{border-top:0}
.log{font-size:14px;color:var(--mut);padding:8px 0;border-top:1px solid var(--line)}
.log:first-of-type{border-top:0}
.pc{display:block;font-size:12px;margin-top:2px}
.score{display:flex;gap:8px;flex-wrap:wrap}
.score div{flex:1;min-width:90px;text-align:center;background:var(--bg);border-radius:16px;padding:8px}
.score .n{font-size:26px;font-weight:800;color:var(--acc2)}
.empty{color:var(--mut);font-size:14px}
.th{max-width:140px;border-radius:8px;margin-top:4px;display:block}
canvas.cv{width:100%;touch-action:none;border-radius:10px;border:1px solid var(--line);cursor:crosshair}
.up{cursor:pointer;padding:10px 14px;border-radius:999px;border:1px solid var(--line);color:var(--mut);display:inline-block}
.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 12% 30%,#ffd21f 0 3px,transparent 4px),radial-gradient(circle at 90% 20%,#ff7ab8 0 4px,transparent 5px),radial-gradient(circle at 80% 62%,#5ef0c8 0 3px,transparent 4px),radial-gradient(circle at 22% 70%,#fff 0 2px,transparent 3px),radial-gradient(circle at 50% 8%,#fff 0 2px,transparent 3px),linear-gradient(160deg,#2f7bff 0%,#4b45e6 55%,#8a3ff0 100%);margin:-16px -16px 20px;padding:46px 20px 16px;text-align:center;border-radius:0 0 32px 32px;box-shadow:0 10px 30px rgba(60,50,200,.3)}
.hero>svg,.hero>h1,.hero>p,.hero>button{position:relative;z-index:1}
.belt{direction:ltr;overflow:hidden;margin:0 -20px;padding:4px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.belt.b2{margin-top:16px}
.belt-in{display:flex;width:max-content;animation:belt 34s linear infinite}
.belt.b2 .belt-in{animation-direction:reverse}
.belt .set{display:flex;gap:12px;padding-right:12px;align-items:center}
@keyframes belt{to{transform:translateX(-50%)}}
.pp{flex:none;display:flex;align-items:center;gap:6px;font:800 14px/1 ui-monospace,Menlo,Consolas,monospace;padding:6px 10px;border-radius:7px;border:2px solid #111;box-shadow:0 3px 0 rgba(0,0,0,.35);letter-spacing:.06em;white-space:nowrap;background:#fff;color:#111}
.pp:nth-child(odd){transform:rotate(-4deg)}.pp:nth-child(even){transform:rotate(3deg) translateY(2px)}
.pp i{font-style:normal;background:#1f4fd8;color:#ffd21f;font-size:9px;letter-spacing:0;padding:0 4px;margin:-6px 0 -6px -10px;border-radius:5px 0 0 5px;align-self:stretch;display:flex;align-items:center;min-width:16px;justify-content:center}
.pp.yl{background:#ffd21f}.pp.bk{background:#111;color:#fff;border-color:#fff}.pp.gn{background:#1d8f4e;color:#fff}.pp.bl{background:#1f4fd8;color:#fff;border-color:#fff}.pp.rd{background:#e5484d;color:#fff}
.pp.us{flex-direction:column;gap:3px;padding:3px 12px 5px}.pp.us small{font:700 7px/1 system-ui,sans-serif;letter-spacing:.14em;color:#1f4fd8}
.gcode{font:900 26px ui-monospace,Menlo,monospace;letter-spacing:.12em;background:var(--bg);border:2px dashed var(--acc2);border-radius:14px;padding:8px;text-align:center;direction:ltr;user-select:all}
a.up{text-decoration:none;color:var(--ink)}
button.star{background:transparent;color:#f5a300;font-size:30px;padding:0 4px;line-height:1}
.rules{border-top:6px solid #ffd21f}
.rules ol{list-style:none;margin:0;padding:0;display:grid;gap:9px;counter-reset:r}
.rules li{counter-increment:r;position:relative;padding-inline-start:38px;min-height:28px;font-size:14px;line-height:1.4}
.rules li:before{content:counter(r);position:absolute;inset-inline-start:0;top:0;width:26px;height:26px;border-radius:50%;background:#ffd21f;color:#111;border:2px solid #111;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 0 #111}
.drive{background:#fff3c4;color:#111;border:2px solid #111;border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.4;margin-bottom:14px}
.chip,#score div[data-pf],#pdN,.debt b{text-transform:uppercase}
#pn{text-transform:uppercase}
#pn::placeholder{text-transform:none}
.hero>svg{display:inline-block;margin-top:10px}
.hero svg{width:min(300px,80%);height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.3));transform:rotate(-3deg)}
.hero h1{color:#fff;font-size:26px;font-weight:900;letter-spacing:.08em;margin:14px 0 4px}
.hero h1 span{color:#ffd21f}
.hero .sub{color:rgba(255,255,255,.88);margin:0}
select.lang{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;flex:none;width:auto;padding:4px 10px;font-size:13px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:999px}
select.lang option{color:#111}
button.share{margin-top:14px;background:#ffd21f;color:#111;border:2px solid #111;font-weight:800;box-shadow:0 3px 0 #111}
input:focus,select:focus,textarea:focus{outline:3px solid #ffd21f;border-color:#111}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:12px 0}.gal figure{margin:0}.gal img{width:100%;border-radius:12px;display:block}.gal figcaption{font-size:13px;color:var(--mut);margin:4px 0}
textarea{width:100%;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#111;color:#ffd21f;font-weight:800;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
summary.h2s{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--acc2);cursor:pointer;list-style:none;padding:2px 0}
summary.h2s::-webkit-details-marker{display:none}
details#howd{margin-bottom:10px}
details#howd p{font-size:14px;margin:8px 0 0;padding:10px;border-radius:12px;background:var(--bg)}
.hero svg{animation:wig 3.2s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(1deg) translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{transform:scale(.4);opacity:.5}}
@media (prefers-reduced-motion:reduce){.hero svg,.tw,.belt-in{animation:none}}
.ava{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--line);display:block;margin:0 auto 4px}
.ava.big{width:96px;height:96px;margin:0 auto 8px}
.score div[data-pf]{cursor:pointer}
dialog{border:0;border-radius:22px;padding:18px;max-width:min(92vw,420px);width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.ini{display:inline-block;font-size:11px;font-weight:800;background:#ffd21f;color:#111;border-radius:99px;padding:1px 8px;margin-left:4px}
.show{position:relative;border-radius:16px;overflow:hidden;background:#111;min-height:200px;display:flex;align-items:center;justify-content:center}
.show img,.show video{width:100%;max-height:360px;object-fit:contain;display:block}
.show .cp{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;color:#fff;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.show button.nv{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);padding:8px 14px;font-size:18px}
.show button.l{left:8px}.show button.r{right:8px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--acc2)}
.gal video{width:100%;border-radius:12px;display:block}
.plate,#pl,#nn{direction:ltr;unicode-bidi:isolate}
#pl,#nn{text-align:start}
.ini{margin-left:0;margin-inline-start:4px}
</style></head><body><main>

,r1:"<b>Tria un número de matrícula</b> a caçar, com el 4830, preferiblement el del teu propi cotxe (familiar).",r2:"<b>Troba el mateix número en un altre cotxe</b>, a qualsevol lloc del món. El primer caçador que el vegi guanya.",r3:"<b>Anota la matrícula completa</b>, amb foto o un videoclip de màx. 6 segons si vols. Les fotos han de ser reals i les lletres es difuminen.",r4:"<b>El guanyador rep un dinar gratis.</b> Els altres caçadors del grup el paguen.",r5:"<b>Un cotxe, un dinar.</b> Cada cotxe diferent compta només una vegada.",r6:"<b>El Caçador Cap també juga.</b> El primer caçador, que va començar el joc, caça amb tots els altres.",story:"Tot va començar al nostre vell Mazda. Jo, Eddy, amb els meus fills Diego i Eliza, quan va passar un cotxe amb la matrícula 4830 FDY. “En fem un joc”, vam dir. “Qui vegi primer el 4830 rep un dinar gratis dels altres.”\n\nDes d'aleshores hem trobat el 4830 a molts països, i cada vegada que algú crida “AQUÍ!” el dinar ja està decidit.\n\nAmics i veïns se'n van assabentar, s'hi van voler apuntar, i ara Good Plate Hunting s'escampa per Barcelona, un dinar rere l'altre.\n\nEddy, Diego i Eliza, caçadors de matrícules. Cada matrícula és una oportunitat de dinar. 🍽️",h2:"2 · Matrícula a caçar",setN:"Fixa",ini:"Caçador Cap",initInfo:"El primer caçador afegit és el Caçador Cap i ha de pagar el dinar si es troba la mateixa matrícula.",hshow:"Presentació",addVideo:"🎬 Afegeix vídeo (màx. 9 segons)",storyNote:"Les fotos i vídeos es mostren tal com es pugen. Afegeix només el teu propi cotxe o difumina abans les matrícules d'altres. Els vídeos es queden en aquest dispositiu.",vBad:"No s'ha pogut llegir aquest vídeo. Prova un altre fitxer.",vLong:"Aquest vídeo dura més de 9 segons. Retalla'l (màx. 9 segons).",pfPhoto:"📷 Foto de perfil",pfBio:"Biografia curta…",pfSave:"Desa",pfClose:"Tanca",pfCars:n=>`🚗 ${n} cotxe${n===1?"":"s"} vist${n===1?"":"os"}`,chgQ:n=>`Canviar la matrícula a caçar a ${n}? Els albiraments anteriors es mantenen.`,how:"C nl:{tag:"Jaag op jouw nummer op een kenteken en win een gratis lunch 🍽️",share:"📣 Daag een vriend uit",carsTot:n=>`🚗 Auto's gevonden met ons kenteken: ${n}`,h1:"1 · Jagers",mT:"Berichten",mPh:"Laat een bericht achter voor de andere jagers…",mSend:"Versturen",mNone:"Nog geen berichten. Zeg hallo tegen de andere jagers! 👋",rvT:"Beoordelingen",rvNone:"Nog geen beoordelingen. Wees de eerste die ons vertelt wat je ervan vindt! ⭐",rvPh:"Wat vind je van Good Plate Hunting?",rvSend:"📧 Beoordeling versturen",rvPick:"Tik eerst op de sterren ⭐",rvSub:"Mijn beoordeling van Good Plate Hunting",gT:"Jachtgroep",gInfo:"Jaag samen: maak een groep, deel de code of uitnodigingslink en iedereen ziet hetzelfde scorebord. Namen, scores en afgeschermde kentekens staan op onze server. Foto's en video's blijven op elke telefoon.",gCreate:"➕ Groep maken",gCode:"Groepscode",gJoin:"Meedoen",gInvite:"📣 Vrienden uitnodigen",gInvTxt:"Doe mee met mijn Good Plate Hunting-groep en kijk wie de gratis lunch wint!",gSync:t=>`✅ Gesynchroniseerd ${t}`,gErr:"⚠️ De groep is nu niet bereikbaar. We proberen het opnieuw.",gNotFound:"Groep niet gevonden. Controleer de code.",gJoinQ:c=>`Meedoen met groep ${c}?`,gReplaceQ:"De jagers en waarnemingen op deze telefoon worden vervangen door die van de groep.",gLeave:"Groep verlaten",gLeaveQ:"Deze groep verlaten? Deze telefoon houdt zijn eigen kopie.",gDel:"🗑️ Groep voor iedereen verwijderen",gDelQ:"Deze groep en de gegevens voor iedereen verwijderen? Dit kan niet ongedaan worden gemaakt.",spT:"Verspreid het plezier",addClip:"🎬 Videoclip toevoegen (max. 6 seconden)",vLong6:"Die clip is langer dan 6 seconden. Knip hem in (max. 6 seconden).",vWarn:"Video's kunnen niet worden vervaagd. Voeg deze clip alleen toe als het kenteken niet leesbaar is of het je eigen auto is. Toch toevoegen?",clipOk:n=>`🎬 Clip klaar (${n} s)`,drive:"🚦 <b>Aan het rijden?</b> Gebruik deze app niet tijdens het rijden. Let op de weg en laat een passagier spotten en noteren!",undoS:"↩ Laatste waarneming ongedaan maken",hr:"Spelregels",r1:"<b>Kies één kentekennummer</b> om te jagen, zoals 4830, bij voorkeur van je eigen (familie)auto.",r2:"<b>Spot hetzelfde nummer op een andere auto</b>, waar ter wereld dan ook. De eerste jager die het ziet wint.",r3:"<b>Noteer het volledige kenteken</b>, eventueel met een foto of videoclip van max. 6 seconden. Foto's moeten echt zijn en de letters worden vervaagd.",r4:"<b>De winnaar krijgt een gratis lunch.</b> De andere jagers in de groep betalen die.",r5:"<b>Eén auto, één lunch.</b> Elke unieke auto telt maar één keer.",r6:"<b>De Hoofdjager doet ook mee.</b> De eerste jager, die het spel begon, jaagt gewoon mee met de anderen.",story:"Het begon allemaal in onze oude Mazda. Ik, Eddy, met mijn kinderen Diego en Eliza, toen er een auto voorbijreed met het kenteken 4830 FDY. “Laten we er een spel van maken”, zeiden we. “Wie als eerste 4830 ziet, krijgt een gratis lunch van de anderen.”\n\nSindsdien hebben we 4830 in veel landen gevonden, en elke keer als iemand “DAAR!” roept, is de lunch al beslist.\n\nVrienden en buren hoorden ervan, wilden meedoen, en nu verspreidt Good Plate Hunting zich door Barcelona, lunch na lunch.\n\nEddy, Diego & Eliza, kentekenjagers. Elk kenteken is een kans op lunch. 🍽️",h2:"2 · Kenteken om te jagen",setN:"Instellen",ini:"Hoofdjager",initInfo:"De eerste jager die wordt toegevoegd is de Hoofdjager en moet de lunch betalen als hetzelfde kenteken wordt gevonden.",hshow:"Diavoorstelling",addVideo:"🎬 Video toevoegen (max. 9 seconden)",storyNote:"Foto's en video's worden getoond zoals ze zijn geüpload. Voeg alleen je eigen auto toe of vervaag eerst de kentekens van anderen. Video's blijven op dit apparaat.",vBad:"Deze video kon niet worden gelezen. Probeer een ander bestand.",vLong:"Die video is langer dan 9 seconden. Knip hem bij (max. 9 seconden).",pfPhoto:"📷 Profielfoto",pfBio:"Korte bio…",pfSave:"Opslaan",pfClose:"Sluiten",pfCars:n=>`🚗 ${n} auto${n===1?"":"'s"} gezien`,chgQ:n=>`Het kenteken om op te jagen wijzigen naar ${n}? Eerdere waarnemingen blijven bewaard.`,how:"Zo werkt het spel: kies ÉÉN kentekennummer om op te jagen, bijvoorbeeld 4830 (het kenteken van ons gezin was 4830 FDY). Zie je een auto met dat nummer, log hem dan met het volledige kenteken en, als je wilt, een foto met vervaagde letters. Wie een auto als eerste ziet, wint een gratis lunch van alle andere spelers. Elke auto telt maar één keer, dus geen dubbele lunches. Je kunt het nummer altijd wijzigen door een nieuw nummer in te typen.",h3:"3 · Ik zag ons kenteken!",hs:"Scorebord",ho:"Wie een lunch verschuldigd is",hl:"Waarnemingen",hst:"Ons verhaal",

App nicht beim Fahren. Augen auf die Straße – lass einen Beifahrer spotten und eintragen!",undoS:"↩ Letzte Sichtung rückgängig",hr:"Spielregeln",r1:"<b>Wähle eine Kennzeichennummer</b> zum Jagen, zum Beispiel 4830, am besten von deinem eigenen (Familien-)Auto.",r2:"<b>Entdecke dieselbe Nummer auf einem anderen Auto</b>, irgendwo auf der Welt. Der erste Jäger, der sie sieht, gewinnt.",r3:"<b>Trage das vollständige Kennzeichen ein</b>, auf Wunsch mit Foto oder Videoclip (max. 6 Sekunden). Fotos müssen echt sein, die Buchstaben werden unkenntlich gemacht.",r4:"<b>Der Gewinner bekommt ein kostenloses Mittagessen.</b> Die anderen Jäger in der Gruppe bezahlen es.",r5:"<b>Ein Auto, ein Mittagessen.</b> Jedes einzelne Auto zählt nur einmal.",r6:"<b>Der Chefjäger spielt mit.</b> Der erste Jäger, der das Spiel gestartet hat, jagt wie alle anderen.",story:"Alles begann in unserem alten Mazda. Ich, Eddy, mit meinen Kindern Diego und Eliza, als ein Auto mit dem Kennzeichen 4830 FDY vorbeifuhr. „Machen wir ein Spiel daraus“, sagten wir. „Wer die 4830 zuerst sieht, bekommt ein kostenloses Mittagessen von den anderen.“\n\nSeitdem haben wir die 4830 in vielen Ländern gefunden, und jedes Mal, wenn jemand „DA!“ ruft, ist das Mittagessen schon entschieden.\n\nFreunde und Nachbarn haben davon gehört, wollten mitmachen, und jetzt breitet sich Good Plate Hunting in Barcelona aus, ein Mittagessen nach dem anderen.\n\nEddy, Diego & Eliza, Kennzeichenjäger. Jedes Kennzeichen ist eine Chance auf ein Mittagessen. 🍽️",h2:"2 · Kennzeichen zum Jagen",h3:"3 · Ich hab unser Kennzeichen gesehen!",hs:"Punktestand",ho:"Wer ein Mittagessen schuldet",hl:"Sichtungen",hst:"Unsere Geschichte",

Regole del gioco",r1:"<b>Scegli un numero di targa</b> da cacciare, come 4830, preferibilmente quello della tua auto (di famiglia).",r2:"<b>Trova lo stesso numero su un'altra auto</b>, ovunque nel mondo. Il primo cacciatore che lo vede vince.",r3:"<b>Registra la targa completa</b>, con foto o videoclip di max 6 secondi se vuoi. Le foto devono essere vere e le lettere vengono sfocate.",r4:"<b>Il vincitore riceve un pranzo gratis.</b> Gli altri cacciatori del gruppo lo pagano.",r5:"<b>Un'auto, un pranzo.</b> Ogni auto diversa conta una sola volta.",r6:"<b>Anche il Capocacciatore gioca.</b> Il primo cacciatore, che ha iniziato il gioco, caccia insieme a tutti gli altri.",story:"Tutto è iniziato nella nostra vecchia Mazda. Io, Eddy, con i miei figli Diego ed Eliza, quando è passata un'auto con la targa 4830 FDY. «Facciamone un gioco», abbiamo detto. «Chi vede per primo il 4830 vince un pranzo gratis dagli altri.»\n\nDa allora abbiamo trovato il 4830 in tanti paesi, e ogni volta che qualcuno grida «LÀ!» il pranzo è già deciso.\n\nAmici e vicini l'hanno saputo, hanno voluto unirsi, e ora Good Plate Hunting si diffonde per Barcellona, un pranzo alla volta.\n\nEddy, Diego ed Eliza, cacciatori di targhe. Ogni targa è un'occasione di pranzo. 🍽️",h2:"2 · Targa da cacciare",h3:"3 · Ho visto la nostra targa!",hs:"Classifica",ho:"Chi deve un pranzo",hl:"Avvistamenti",hst:"La nostra storia",

function readExif(buf){const v=new DataView(buf);if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return null;let o=2;

  if(m===0xFFE1){const len=v.getUint16(o);if(v.getUint32(o+2)===0x45786966)return parseTiff(v,o+8);o+=len}
  else if((m&0xFF00)===0xFF00&&m!==0xFFDA){o+=v.getUint16(o)}else break}

/* ---- story ---- */
let editing=false,ST={text:null,photos:[]};const OLDST="It started with me, Eddy, and my kids Diego and Eliza in our old Mazda. We spotted a plate, 4830 FDY, picked 4830 as our number and made a deal: whoever spots 4830 first gets a free lunch from the others.\n\nWe turned it into a game, and since then we have found 4830 in many countries. Friends and neighbours heard about it, started hunting too, and now Good Plate Hunting is spreading around Barcelona, one lunch at a time.\n\nAbout us: Eddy, Diego and Eliza, plate hunters. Every plate is a chance for lunch.";
const stText=()=>ST.text==null?t("story"):ST.text;
try{const r=localStorage.getItem("platelunch.story");if(r)ST=JSON.parse(r)}catch(e){}
if(ST.text===OLDST||typeof ST.text!=="string")ST.text=null;if(!Array.isArray(ST.photos))ST.photos=[];
function saveST(){try{localStorage.setItem("platelunch.story",JSON.stringify(ST))}catch(e){alert(t("full"))}renderST()}
function renderST(){$("stT").textContent=stText();
 $("stG").innerHTML=ST.photos.filter(p=>okImg(p.img)).map((p,i)=>`<figure><img src="${p.img}" alt=""><figcaption>${esc(p.cap||"")}</figcaption>${editing?`<button class="ghost" data-r="${i}">${t("rm")}</button>`:""}</figure>`).join("");
 $("stT").hidden=editing;$("stE").hidden=!editing;$("stB").textContent=editing?t("saveSt"):t("editSt");renderMedia()}
$("stB").onclick=()=>{if(editing){const v=$("stX").value;ST.text=v===stText()?null:v;editing=false;saveST()}else{editing=true;$("stX").value=stText();renderST()}};
$("stG").onclick=e=>{const i=e.target.dataset.r;if(i!==undefined){ST.photos=ST.photos.filter(p=>okImg(p.img));ST.photos.splice(i,1);saveST()}};
$("stP").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,600/im.width),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);const cap=prompt(t("cap"),"")||"";ST.photos.push({img:c.toDataURL("image/jpeg",.65),cap});saveST()};im.src=URL.createObjectURL(f);e.target.value=""};

/* ---- videos (max 9 s, kept on this device) and slideshow ---- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open("platelunch-media",1);r.onupgradeneeded=()=>r.result.createObjectStore("v",{keyPath:"id",autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function vAll(){try{const d=await idb();return await new Promise((ok,no)=>{const q=d.transaction("v").objectStore("v").getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}catch(e){return[]}}
async function vPut(o){const d=await idb();return new Promise((ok,no)=>{const q=d.transaction("v","readwrite").objectStore("v").add(o);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
async function vDel(id){const d=await idb();return new Promise((ok,no)=>{const q=d.transaction("v","readwrite").objectStore("v").delete(id);q.onsuccess=()=>ok();q.onerror=()=>no(q.error)})}
let SHOW=[],shi=0,shT=null,vUrls=[];
const still=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function drawShow(){clearTimeout(shT);const c=$("slideCard");c.hidden=!SHOW.length;if(!SHOW.length)return;shi=(shi+SHOW.length)%SHOW.length;const s=SHOW[shi],many=SHOW.length>1;
 $("show").innerHTML=(s.k==="v"?`<video src="${s.src}" autoplay muted playsinline ${many?"":"loop"}></video>`:`<img src="${s.src}" alt="">`)+`<div class="cp">${esc(s.cap||"")}</div>`+(many?`<button class="nv l" data-s="-1" aria-label="previous">‹</button><button class="nv r" data-s="1" aria-label="next">›</button>`:"");
 $("dots").innerHTML=many?SHOW.map((_,i)=>`<i class="${i===shi?"on":""}"></i>`).join(""):"";
 if(!many||still())return;
 const go=()=>{shi++;drawShow()};
 if(s.k==="v"){$("show").querySelector("video").onended=go;shT=setTimeout(go,11000)}else shT=setTimeout(go,4000)}
$("show").onclick=e=>{const b=e.target.closest("[data-s]");if(b){shi+=+b.dataset.s;drawShow()}};
async function renderMedia(){vUrls.forEach(u=>URL.revokeObjectURL(u));vUrls=[];const vs=await vAll();
 vs.forEach(v=>{v._u=URL.createObjectURL(v.blob);vUrls.push(v._u)});
 $("stVd").innerHTML=vs.filter(v=>!v.spot).map(v=>{return`<figure><video src="${v._u}" controls playsinline preload="metadata"></video><figcaption>${esc(v.cap||"")}</figcaption>${editing?`<button class="ghost" data-vr="${v.id}">${t("rm")}</button>`:""}</figure>`}).join("");
 SHOW=[...ST.photos.filter(p=>okImg(p.img)).map(p=>({k:"i",src:p.img,cap:p.cap})),...vs.map(v=>({k:"v",src:v._u,cap:v.cap})),...S.events.filter(e=>e.t==="spot"&&okImg(e.img)).map(e=>({k:"i",src:e.img,cap:(e.plate||e.num)+" · "+e.who}))];
 shi=0;drawShow()}
$("stVd").onclick=async e=>{const b=e.target.closest("[data-vr]");if(b){try{await vDel(+b.dataset.vr)}catch(_){}renderMedia()}};
$("stV").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 const url=URL.createObjectURL(f),v=document.createElement("video");v.preload="metadata";
 const dur=await new Promise(ok=>{v.onloadedmetadata=()=>ok(v.duration);v.onerror=()=>ok(NaN);v.src=url});URL.revokeObjectURL(url);
 if(!(dur>0)){alert(t("vBad"));return}
 if(dur>9.5){alert(t("vLong"));return}
 const cap=prompt(t("cap"),"")||"";
 try{await vPut({blob:f,type:f.type,cap,ts:Date.now()})}catch(_){alert(t("full"));return}
 renderMedia()};

let pfName=null,pfImg=null;
function openProf(i){const n=S.players[i];if(n==null)return;pfName=n;const p=S.prof[n]||{};pfImg=okImg(p.img)?p.img:null;
 $("pdN").textContent=n;$("pdI").innerHTML=i===0?`<span class="ini">${t("ini")}</span>`:"";$("pdA").src=pfImg||ava(n);$("pdB").value=p.bio||"";
 const sp=S.events.filter(e=>e.t==="spot"&&e.who===n);
 $("pdS").innerHTML=`<b>${t("pfCars",sp.length)}</b>`+(sp.length?"<br>"+sp.slice(-20).reverse().map(e=>`<span class="plate" style="font-size:12px;padding-left:22px;margin:2px 4px 2px 0">${esc(e.plate||e.num)}</span>`).join(""):"");
 $("pd").showModal()}

$("pdF").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=160;const s=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);URL.revokeObjectURL(im.src);pfImg=c.toDataURL("image/jpeg",.7);$("pdA").src=pfImg};im.src=URL.createObjectURL(f)};
$("pdSave").onclick=()=>{S.prof[pfName]={img:pfImg,bio:$("pdB").value.slice(0,140)};$("pd").close();save()};
$("pdX").onclick=()=>$("pd").close();

/* ---- share, backup, install, reset, language ---- */
$("share").onclick=async()=>{const si=shareInfo(),d={title:"Good Plate Hunting",text:si.text,url:si.url};
 try{if(navigator.share){await navigator.share(d);return}}catch(e){if(e&&e.name==="AbortError")return}
 try{await navigator.clipboard.writeText(d.text+" "+d.url);toast(t("copied"))}catch(e){prompt(d.text,d.url)}};

 try{const j=JSON.parse(await f.text());
  if(j.app!=="goodplatehunting"||!j.S||!Array.isArray(j.S.players)||!Array.isArray(j.S.events)||!Array.isArray(j.S.nums))throw 0;

  if(j.ST&&(j.ST.text==null||typeof j.ST.text==="string")&&Array.isArray(j.ST.photos))ST={text:(j.ST.text===OLDST?null:j.ST.text)??null,photos:j.ST.photos.filter(p=>p&&okImg(p.img)).map(p=>({img:p.img,cap:String(p.cap||"")}))};
  try{localStorage.setItem("platelunch.story",JSON.stringify(ST))}catch(_){}
  fixS();save();renderST();toast(t("impOk"))}catch(_){alert(t("impBad"))}};
let dip=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e;$("inst").hidden=false});
$("inst").onclick=async()=>{if(!dip)return;dip.prompt();dip=null;$("inst").hidden=true};

function applyLang(){document.documentElement.lang=LG;document.documentElement.dir=LG==="ar"?"rtl":"ltr";$("lang").value=LG;

/* ---- shared hunt groups (sync with /api/g) ---- */
const GKEY="platelunch.group";
let gc=null,gBusy=false,gAgain=false,gTm=null,gSt={ok:0,err:false};
try{gc=localStorage.getItem(GKEY)||null}catch(_){}
if(gc&&!/^[A-Z2-9]{10}$/.test(gc))gc=null;
const gFmt=c=>c.slice(0,5)+"-"+c.slice(5);
const gNorm=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function toDoc(){return{pt:S.pt,rt:S.rt,nums:S.nums.slice(0,1),numT:S.numT||0,rmE:S.rmE,events:S.events.map(e=>{const{img,vid,...r}=e;return r})}}
function applyDoc(D){
 S.pt=D.pt||{};S.rt=D.rt||{};S.numT=D.numT||0;S.rmE=D.rmE||[];
 S.players=Object.keys(S.pt).filter(n=>S.pt[n]>(S.rt[n]||0)).sort((a,b)=>S.pt[a]-S.pt[b]||(a<b?-1:1));
 S.nums=(D.nums||[]).slice(0,1);
 const loc=new Map(S.events.map(e=>[e.id,e])),inD=new Set((D.events||[]).map(e=>e.id)),gone=new Set(S.rmE);
 S.events=[...(D.events||[]).map(e=>loc.get(e.id)||e),...S.events.filter(e=>!inD.has(e.id)&&!gone.has(e.id))]}
async function sync(){
 if(!gc)return;if(gBusy){gAgain=true;return}
 gBusy=true;
 try{
  const r=await fetch("/api/g/"+gc+"/sync",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(toDoc())});
  if(r.status===404){gLeaveLocal();alert(t("gNotFound"));return}
  if(!r.ok)throw 0;
  const{doc}=await r.json(),before=JSON.stringify(toDoc());
  applyDoc(doc);gSt={ok:Date.now(),err:false};
  if(JSON.stringify(toDoc())!==before)persist();else gRender()}
 catch(_){gSt.err=true;gRender()}
 finally{gBusy=false;if(gAgain){gAgain=false;schedSync()}}}
function schedSync(){if(!gc)return;clearTimeout(gTm);gTm=setTimeout(sync,700)}
function setGc(c){gc=c;try{localStorage.setItem(GKEY,c)}catch(_){}gRender();renderShare()}
function gLeaveLocal(){gc=null;try{localStorage.removeItem(GKEY)}catch(_){}gRender();renderShare()}
function gRender(){$("gOff").hidden=!!gc;$("gOn").hidden=!gc;
 if(gc){$("gC").textContent=gFmt(gc);const e=$("gSt");
  e.textContent=gSt.err?t("gErr"):(gSt.ok?t("gSync",new Date(gSt.ok).toLocaleTimeString(LG,{hour:"2-digit",minute:"2-digit"})):"");
  e.style.color=gSt.err?"var(--bad)":"var(--ok)"}}
$("gNew").onclick=async()=>{try{const r=await fetch("/api/g",{method:"POST"});if(!r.ok)throw 0;const{code}=await r.json();setGc(code);sync()}catch(_){alert(t("gErr"))}};
async function gJoinCode(raw){
 const c=gNorm(raw);if(!/^[A-Z2-9]{10}$/.test(c)){alert(t("gNotFound"));return}
 try{
  const r=await fetch("/api/g/"+c);
  if(r.status===404||r.status===400){alert(t("gNotFound"));return}
  if(!r.ok)throw 0;
  const{doc}=await r.json(),has=S.players.length||S.events.length;
  if(!confirm(t("gJoinQ",gFmt(c))+(has?"\n\n"+t("gReplaceQ"):"")))return;
  S={players:[],nums:[],events:[],prof:S.prof||{},pt:{},rt:{},rmE:[],numT:0};applyDoc(doc);setGc(c);persist();sync()}
 catch(_){alert(t("gErr"))}}
$("gGo").onclick=()=>gJoinCode($("gIn").value);
$("gIn").onkeydown=e=>{if(e.key==="Enter")gJoinCode($("gIn").value)};
$("gLv").onclick=()=>{if(confirm(t("gLeaveQ")))gLeaveLocal()};
$("gDl").onclick=async()=>{if(!gc||!confirm(t("gDelQ")))return;try{const r=await fetch("/api/g/"+gc,{method:"DELETE"});if(!r.ok)throw 0;gLeaveLocal()}catch(_){alert(t("gErr"))}};
$("gInv").onclick=()=>$("share").onclick();
setInterval(()=>{if(gc&&document.visibilityState==="visible")sync()},30000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()});

 $("rvL").innerHTML=REVIEWS.map(r=>`<div class="log"><span style="color:#f5a300">${"★".repeat(r.stars)}${"☆".repeat(5-r.stars)}</span> <b>${esc(r.name)}</b><div style="color:var(--ink)">${esc(r.text)}</div></div>`).join("");

 $("rvS").innerHTML=[1,2,3,4,5].map(n=>`<button class="star" data-s="${n}" aria-label="${n}">${n<=rate?"★":"☆"}</button>`).join("")}

 location.href="mailto:hello@goodplatehunting.com?subject="+encodeURIComponent(t("rvSub")+" "+"★".repeat(rate))+"&body="+encodeURIComponent("★".repeat(rate)+"☆".repeat(5-rate)+"\n\n"+$("rvX").value)};

function shareInfo(){

 return{url:gc?base+"/?join="+gc:base,text:gc?t("gInvTxt"):t("shareTxt")}}

 $("spL").innerHTML=[["💬 WhatsApp","https://wa.me/?text="+both],["✈️ Telegram","https://t.me/share/url?url="+u+"&text="+x],["𝕏","https://twitter.com/intent/tweet?text="+x+"&url="+u],["📘 Facebook","https://www.facebook.com/sharer/sharer.php?u="+u],["✉️ Email","mailto:?subject="+encodeURIComponent("Good Plate Hunting")+"&body="+both]]

(function(){try{const u=new URL(location.href),j=u.searchParams.get("join");if(j){u.searchParams.delete("join");history.replaceState(null,"",u.pathname+(u.search||"")+u.hash);if(!(gc&&gNorm(j)===gc))setTimeout(()=>gJoinCode(j),600)}}catch(_){}})();
if(gc)sync();
document.querySelectorAll(".belt-in").forEach(b=>{b.innerHTML+=b.innerHTML});
